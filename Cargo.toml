[workspace]
resolver = "2"
members = ["crates/vasya-channel", "crates/vasya-core", "crates/vasya-server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Unlicense"

# Fixes the channel-id range (grammers-session 0.8 panics with `unreachable!()`
# on some channels). Consumers must repeat this patch in their own top-level
# Cargo.toml: Cargo ignores [patch] in dependencies.
[patch.crates-io]
grammers-session = { path = "vendor/grammers-session" }
